name: huatlui
description: Personal investment portfolio tracker.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  intl: any
  uuid: ^4.2.1
  http: ^1.2.2
  html: ^0.15.4
  package_info_plus: ^8.0.0
  local_auth: ^2.3.0

  file_picker: ^10.3.10
  google_mobile_ads: ^6.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FAFAF8"
  image: assets/icons/app_icon_tran.png
  color_dark: "#0D0E10"
  image_dark: assets/icons/app_icon_tran.png