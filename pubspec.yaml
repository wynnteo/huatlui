name: huatlui
description: Personal investment portfolio tracker.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  intl: any
  uuid: ^4.2.1

  file_picker: ^10.3.10
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Later: http or dio for the API-backed sync layer and live FX rates.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true  # turns on gen-l10n, reads l10n.yaml, builds AppLocalizations from the .arb files
